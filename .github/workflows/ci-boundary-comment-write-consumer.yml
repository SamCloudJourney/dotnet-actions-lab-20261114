name: CI Boundary Lab Comment-Write Consumer
on:
  workflow_run:
    workflows: ['CI Boundary Synthetic Producer']
    types: [completed]
permissions:
  actions: read
  issues: write
jobs:
  comment-fixture:
    if: >-
      github.repository == 'SamCloudJourney/dotnet-actions-lab-20261114' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'research/ci-comment-cross-target-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download triggering run's synthetic results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-boundary-synthetic
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Demonstrate only the pre-authorized lab PR comment sink
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const run = context.payload.workflow_run;
            const trustedPR = run.pull_requests?.[0]?.number;
            const requested = Number(fs.readFileSync('pr-number.txt', 'utf8').trim());
            const origin = run.head_repository?.full_name;
            console.log(JSON.stringify({requested, trustedPR, origin, sourceRun:run.id}));
            if (!Number.isSafeInteger(trustedPR) || trustedPR <= 1) throw new Error('expected lab PR #2+');
            if (requested !== 1 || requested === trustedPR) throw new Error('not the designated fixture PR #1');
            if (origin !== 'SamCloudJourney/dotnet-actions-lab-20261114') throw new Error('unexpected source repository');
            const body = [
              '**LAB ONLY — controlled CI trust-boundary evidence.**',
              '',
              'This harmless test comment was created by a GitHub Actions workflow_run consumer.',
              'Triggering PR: #' + trustedPR + '.',
              'Artifact-requested destination PR: #' + requested + '.',
              'Source run: ' + run.id + '.',
              '',
              'No Microsoft system, genuine PAT, third-party mutable action, or other issue/PR target was used.'
            ].join('\n');
            const response = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: requested,
              body
            });
            console.log('LAB_CROSS_TARGET_COMMENT_CREATED_ID=' + response.data.id);
            console.log('LAB_TRUSTED_PR=' + trustedPR + ' LAB_UNTRUSTED_REQUESTED_PR=' + requested);
