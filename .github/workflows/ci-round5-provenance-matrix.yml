name: Round5 PR artifact provenance matrix
on:
  workflow_run:
    workflows: ['CI Boundary Synthetic Producer']
    types: [completed]
permissions:
  actions: read
  contents: read
jobs:
  verify-provenance:
    if: >-
      github.repository == 'SamCloudJourney/dotnet-actions-lab-20261114' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'research/round5-prov-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download exact source-run artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-boundary-synthetic
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Compare artifact target with trusted triggering PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const source = context.payload.workflow_run;
            const real = Number(source.pull_requests?.[0]?.number);
            const raw = fs.readFileSync('pr-number.txt','utf8').trim();
            const requested = Number(raw);
            const normal = source.head_branch === 'research/round5-prov-normal-20261116';
            const modified = source.head_branch === 'research/round5-prov-yaml-20261116';
            if (!normal && !modified) throw Error('non-fixture source branch');
            if (source.head_repository?.full_name !== context.repo.owner+'/'+context.repo.repo) throw Error('foreign source not expected in test');
            if (!Number.isSafeInteger(real) || real < 8) throw Error('missing actual PR event identity');
            if (normal && requested !== real) throw Error('ordinary file PR changed trusted target');
            if (modified && requested !== 80888) throw Error('expected inert workflow override not present');
            if (modified && requested === real) throw Error('unexpected no mismatch');
            console.log('ROUND5_ARTIFACT_PROVENANCE='+JSON.stringify({
              branch:source.head_branch,
              sourceRun:source.id,
              sourceConclusion:source.conclusion,
              trustedPr:real,
              artifactPr:requested,
              artifactMatchesTrustedPr:real===requested,
              producerWorkflowModified:modified,
              apiWrites:false
            }));
