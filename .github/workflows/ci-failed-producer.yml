name: CI Boundary Deliberately Failed Producer
on:
  pull_request:
    paths: ['.github/workflows/ci-failed-producer.yml', 'research-evidence/failed-producer-input.txt']
permissions:
  contents: read
jobs:
  produce-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Produce inert metadata for a deliberately unsuccessful run
        shell: bash
        run: |
          mkdir -p ci-failed
          printf '%s\n' '${{ github.event.pull_request.number }}' > ci-failed/pr-number.txt
          printf '1\n' > ci-failed/total.txt
          printf 'LAB ONLY: safe artifact from a deliberately failed run\n' > ci-failed/sv-output.txt
      - name: Persist artifact despite later failed check
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-boundary-failed-results
          path: ci-failed/
          retention-days: 1
      - name: Expected failure to validate workflow_run conclusion gate
        run: |
          echo 'LAB_EXPECTED_FAILURE_AFTER_ARTIFACT_UPLOAD'
          exit 7

# MAUI success-only workflow_run guard negative test (intentionally fails).
