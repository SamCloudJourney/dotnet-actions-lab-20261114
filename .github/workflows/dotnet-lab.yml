name: .NET lab smoke

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Standard GitHub-hosted runner
        required: true
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - windows-latest
          - macos-latest
      sdk:
        description: Supported .NET SDK line
        required: true
        type: choice
        default: 11.0.100
        options:
          - 11.0.100
          - 10.0.x

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out public lab
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ inputs.sdk }}
      - name: Run public smoke test
        shell: bash
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: bash tests/run.sh
