name: Generic QUIC Linux x64 listener smoke

on:
  push:
    branches:
      - f22-generic-quic-x64-smoke-20261114

permissions:
  contents: read

jobs:
  listener:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out public smoke
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 11.0.100
      - name: Run generic listener smoke
        shell: bash
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: bash tests/run.sh
