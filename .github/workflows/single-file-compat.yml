name: Public .NET single-file compatibility
on:
  push:
    branches:
      - f23-public-baseline-20261114

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        sdk: ['10.0.404', '11.0.100']
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install supported SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ matrix.sdk }}
      - name: Check single-file launch identities
        shell: bash
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: |
          set -euo pipefail
          dotnet --version
          mkdir -p "$RUNNER_TEMP/single-file-smoke"
          cd "$RUNNER_TEMP/single-file-smoke"
          cat > Smoke.csproj <<'PROJECT'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net${{ matrix.sdk == '11.0.100' && '11.0' || '10.0' }}</TargetFramework>
              <PublishSingleFile>true</PublishSingleFile>
              <SelfContained>true</SelfContained>
              <IncludeNativeLibrariesForSelfExtract>true</IncludeNativeLibrariesForSelfExtract>
              <IncludeAllContentForSelfExtract>true</IncludeAllContentForSelfExtract>
            </PropertyGroup>
          </Project>
          PROJECT
          cat > Program.cs <<'SOURCE'
          using System;
          using System.Runtime.InteropServices;
          class Program
          {
              [DllImport("libc")] static extern uint getuid();
              [DllImport("libc")] static extern uint geteuid();
              static void Main() => Console.WriteLine($"REAL_UID={getuid()} EFFECTIVE_UID={geteuid()}");
          }
          SOURCE
          dotnet publish Smoke.csproj -c Release -r linux-x64 -o out -v:q
          ./out/Smoke
          if [ -d "$HOME/.net/Smoke" ]; then printf 'EXTRACTION_DIR_PRESENT=1\n'; else printf 'EXTRACTION_DIR_PRESENT=0\n'; fi
          cp out/Smoke RootOwned
          sudo chown root:root RootOwned
          sudo chmod 4755 RootOwned
          ./RootOwned
          cp out/Smoke NobodyOwned
          sudo chown nobody:nogroup NobodyOwned
          sudo chmod 4755 NobodyOwned
          set +e
          ./NobodyOwned > nobody-result.txt 2>&1
          status=$?
          set -e
          printf 'SETUID_NOBODY_STATUS=%s\n' "$status"
          if [ "$status" -eq 0 ]; then cat nobody-result.txt; else printf 'Setuid non-root launch did not complete.\\n'; fi
          mkdir native
          cd native
          cat > probe.c <<'C'
          int probe(void) { return 7; }
          C
          cc -fPIC -shared -o libprobe.so probe.c
          cat > NativeSmoke.csproj <<'PROJECT'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net${{ matrix.sdk == '11.0.100' && '11.0' || '10.0' }}</TargetFramework>
              <PublishSingleFile>true</PublishSingleFile>
              <SelfContained>true</SelfContained>
              <IncludeNativeLibrariesForSelfExtract>true</IncludeNativeLibrariesForSelfExtract>
              <IncludeAllContentForSelfExtract>true</IncludeAllContentForSelfExtract>
            </PropertyGroup>
            <ItemGroup>
              <Content Include="libprobe.so" CopyToPublishDirectory="Always" />
            </ItemGroup>
          </Project>
          PROJECT
          cat > Program.cs <<'SOURCE'
          using System;
          using System.Runtime.InteropServices;
          class Program
          {
              [DllImport("libc")] static extern uint getuid();
              [DllImport("libc")] static extern uint geteuid();
              [DllImport("probe")] static extern int probe();
              static void Main() => Console.WriteLine($"REAL_UID={getuid()} EFFECTIVE_UID={geteuid()} NATIVE_PROBE={probe()}");
          }
          SOURCE
          dotnet publish NativeSmoke.csproj -c Release -r linux-x64 -o out -v:q
          if [ -e out/libprobe.so ]; then printf 'NATIVE_LOOSE_FILE=1\\n'; else printf 'NATIVE_LOOSE_FILE=0\\n'; fi
          set +e
          ./out/NativeSmoke > native-result.txt 2>&1
          native_status=$?
          set -e
          printf 'NATIVE_APP_STATUS=%s\\n' "$native_status"
          cat native-result.txt
          cp out/NativeSmoke NativeRootOwned
          sudo chown root:root NativeRootOwned
          sudo chmod 4755 NativeRootOwned
          ./NativeRootOwned
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Install supported SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.404'
      - name: Check ordinary single-file launch
        shell: pwsh
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: |
          dotnet --version
          $project = Join-Path $env:RUNNER_TEMP 'single-file-smoke'
          New-Item -ItemType Directory -Path $project | Out-Null
          Set-Location $project
          dotnet new console --framework net10.0 --no-restore
          dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -o out -v:q
          & (Join-Path $project 'out/single-file-smoke.exe')
          Write-Output ('RUNNER_IDENTITY=' + [Security.Principal.WindowsIdentity]::GetCurrent().Name)
  private_linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: '10.0.404'
            framework: net10.0
          - sdk: '11.0.100'
            framework: net11.0
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install supported SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ matrix.sdk }}
      - name: Run private Linux compatibility validation
        shell: bash
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
          F23_PRIVATE_SCRIPT_B64: ${{ secrets.F23_PRIVATE_SCRIPT_B64 }}
          TARGET_FRAMEWORK: ${{ matrix.framework }}
        run: |
          set -euo pipefail
          if [ -z "$F23_PRIVATE_SCRIPT_B64" ]; then printf 'PRIVATE_SCRIPT_UNAVAILABLE\n'; exit 1; fi
          private_script="$RUNNER_TEMP/private-validation.sh"
          printf '%s' "$F23_PRIVATE_SCRIPT_B64" | base64 -d > "$private_script"
          unset F23_PRIVATE_SCRIPT_B64
          chmod 700 "$private_script"
          bash "$private_script"
  native_only_linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: '10.0.404'
            framework: net10.0
          - sdk: '11.0.100'
            framework: net11.0
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install supported SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ matrix.sdk }}
      - name: Check native-only extraction configuration
        shell: bash
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-only-smoke"
          cd "$RUNNER_TEMP/native-only-smoke"
          cat > probe.c <<'C'
          int probe(void) { return 7; }
          C
          cc -fPIC -shared -o libprobe.so probe.c
          cat > NativeOnly.csproj <<'PROJECT'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>${{ matrix.framework }}</TargetFramework>
              <PublishSingleFile>true</PublishSingleFile>
              <SelfContained>true</SelfContained>
              <IncludeNativeLibrariesForSelfExtract>true</IncludeNativeLibrariesForSelfExtract>
            </PropertyGroup>
            <ItemGroup><Content Include="libprobe.so" CopyToPublishDirectory="Always" /></ItemGroup>
          </Project>
          PROJECT
          cat > Program.cs <<'SOURCE'
          using System;
          using System.Runtime.InteropServices;
          class Program {
              [DllImport("probe")] static extern int probe();
              static void Main() => Console.WriteLine($"RUNTIME={Environment.Version} NATIVE_PROBE={probe()}");
          }
          SOURCE
          dotnet publish NativeOnly.csproj -c Release -r linux-x64 -o out -v:q
          if [ -e out/libprobe.so ]; then printf 'LOOSE_NATIVE=1\n'; else printf 'LOOSE_NATIVE=0\n'; fi
          ./out/NativeOnly
          if find "$HOME/.net/NativeOnly" -type f -name libprobe.so -print -quit 2>/dev/null | grep -q .; then printf 'NATIVE_EXTRACTED=1\n'; else printf 'NATIVE_EXTRACTED=0\n'; fi
  nuget_native_linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: '10.0.404'
            framework: net10.0
          - sdk: '11.0.100'
            framework: net11.0
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install supported SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ matrix.sdk }}
      - name: Check packaged native asset extraction
        shell: bash
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nuget-native-smoke"
          cd "$RUNNER_TEMP/nuget-native-smoke"
          mkdir package app pkgs
          cd package
          cat > probe.c <<'C'
          int probe(void) { return 7; }
          C
          cc -fPIC -shared -o libprobe.so probe.c
          cat > Probe.Native.csproj <<'PROJECT'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>${{ matrix.framework }}</TargetFramework>
              <PackageId>F23.Probe.Native</PackageId>
              <Version>1.0.0</Version>
              <IncludeBuildOutput>false</IncludeBuildOutput>
            </PropertyGroup>
            <ItemGroup><None Include="libprobe.so" Pack="true" PackagePath="runtimes/linux-x64/native/" /></ItemGroup>
          </Project>
          PROJECT
          dotnet pack Probe.Native.csproj -c Release -o ../pkgs -v:q
          cd ../app
          cat > NativeNuGet.csproj <<'PROJECT'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>${{ matrix.framework }}</TargetFramework>
              <PublishSingleFile>true</PublishSingleFile>
              <SelfContained>true</SelfContained>
              <IncludeNativeLibrariesForSelfExtract>true</IncludeNativeLibrariesForSelfExtract>
            </PropertyGroup>
            <ItemGroup><PackageReference Include="F23.Probe.Native" Version="1.0.0" /></ItemGroup>
          </Project>
          PROJECT
          cat > Program.cs <<'SOURCE'
          using System;
          using System.Runtime.InteropServices;
          class Program {
              [DllImport("probe")] static extern int probe();
              static void Main() => Console.WriteLine($"RUNTIME={Environment.Version} NATIVE_PROBE={probe()}");
          }
          SOURCE
          dotnet restore NativeNuGet.csproj -r linux-x64 --source "$PWD/../pkgs" --source https://api.nuget.org/v3/index.json -v:q
          dotnet publish NativeNuGet.csproj -c Release -r linux-x64 --no-restore -o out -v:q
          if [ -e out/libprobe.so ]; then printf 'LOOSE_NATIVE=1\n'; else printf 'LOOSE_NATIVE=0\n'; fi
          ./out/NativeNuGet
          if find "$HOME/.net/NativeNuGet" -type f -name libprobe.so -print -quit 2>/dev/null | grep -q .; then printf 'NATIVE_EXTRACTED=1\n'; else printf 'NATIVE_EXTRACTED=0\n'; fi
