name: IIS in-process path authorization lab

on:
  push:
    branches:
      - iis-path-04-lab-20261114

permissions:
  contents: read

jobs:
  path-authorization:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Check out public lab
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install .NET 11 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 11.0.100
      - name: Reproduce IIS path authorization
        shell: powershell
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: ./tests/iis-path-04.ps1
