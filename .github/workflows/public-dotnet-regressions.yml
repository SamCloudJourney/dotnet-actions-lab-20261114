name: Public .NET release-regression checks

# Researcher-controlled branch only. Run no untrusted payloads or external targets.
on:
  push:
    branches:
      - audit-public-regressions-20261115
    paths:
      - '.github/workflows/public-dotnet-regressions.yml'
      - 'tests/PublicRegressions/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-dotnet-regressions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  published-fixture:
    name: Published ASP.NET regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout owned public lab
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 11.0.100
      - name: Check published regression in-memory
        shell: bash
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: dotnet run --project tests/PublicRegressions/PublicRegressions.csproj --configuration Release
