name: Round5 MAUI checkout/push destination control
on:
  push:
    branches: [research/round5-maui-head-push-20261116]
permissions:
  contents: read
jobs:
  simulated-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify local fork and same-repo push destination
        run: bash tests/round5-maui-head-push.sh
