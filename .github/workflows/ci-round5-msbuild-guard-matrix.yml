name: Round5 MSBuild provenance and comment-ownership regression
on:
  push:
    branches: [research/msbuild-source-fidelity-20261116]
permissions:
  contents: read
jobs:
  baseline-and-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test actual MSBuild handler with mocked API
        run: node tests/msbuild-source-fidelity-harness.cjs
      - name: Test fail-closed remediation matrix
        run: node tests/msbuild-round5-guard-matrix.cjs
