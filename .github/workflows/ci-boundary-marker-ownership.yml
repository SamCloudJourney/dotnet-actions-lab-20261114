name: CI Boundary Lab Marker Ownership Test
on:
  workflow_run:
    workflows: ['CI Boundary Synthetic Producer']
    types: [completed]
permissions:
  issues: write
  pull-requests: write
  actions: read
jobs:
  inspect:
    if: >-
      github.repository == 'SamCloudJourney/dotnet-actions-lab-20261114' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'research/ci-marker-update-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test GitHub token comment author enforcement against researcher-owned fixture
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: 1, per_page: 100
            });
            const marker = '<!-- skill-validator-results -->';
            const candidate = comments.find(c => c.id === 6909337950 && c.body.includes(marker));
            if (!candidate || candidate.user?.login !== 'SamCloudJourney') throw new Error('expected human-owned fixture not found');
            console.log('LAB_MARKER_AUTHOR=' + candidate.user.login);
            console.log('LAB_MARKER_COMMENT_ID=' + candidate.id);
            try {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: candidate.id,
                body: marker + '\nLAB FIXTURE: bot attempted to update a human-authored marker comment.'
              });
              console.log('LAB_BOT_UPDATED_HUMAN_COMMENT=true');
            } catch (err) {
              console.log('LAB_BOT_UPDATED_HUMAN_COMMENT=false');
              console.log('LAB_UPDATE_REJECTED_HTTP_STATUS=' + (err.status ?? 'unknown'));
              if (err.status !== 403 && err.status !== 404) throw err;
            }
